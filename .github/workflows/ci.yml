name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  build:
    name: 构建 linux-amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # CGO_ENABLED=0 不是可选项：交付物是静态二进制，
      # 开着 cgo 交叉编译会去找目标平台的 C 工具链。
      - name: 构建
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o dist/vulhub .

      - name: 校验产物
        run: |
          file dist/vulhub
          file dist/vulhub | grep -q "statically linked"

      - uses: actions/upload-artifact@v4
        with:
          name: vulhub-cli-linux-amd64
          path: dist/vulhub
          if-no-files-found: error
